<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="劉晉亨 Patrick Liou｜製程整合、資料科學與 AI 自動化履歷">
  <meta name="theme-color" content="#07111f">
  <title>劉晉亨 Patrick Liou｜Resume</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2e;--line:#203755;--text:#eef6ff;--muted:#a9bfd7;--accent:#62d7c5;--gold:#ffca6b;--max:1120px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#153558 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75}a{color:inherit}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
    nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand{font-weight:850;letter-spacing:.08em}.navlinks{display:flex;gap:20px}.navlinks a{color:var(--muted);text-decoration:none}.navlinks a:hover{color:var(--accent)}
    .hero{min-height:76vh;padding:64px 0;display:grid;grid-template-columns:1.45fr .65fr;gap:56px;align-items:center}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(3rem,8vw,6.6rem);line-height:.95;margin:.2em 0}.hero h1 span{display:block;color:var(--muted);font-size:.34em;line-height:1.4;margin-top:18px}.lead{font-size:clamp(1.05rem,2vw,1.3rem);max-width:750px;color:var(--muted)}.portrait{width:min(100%,310px);aspect-ratio:4/5;object-fit:cover;object-position:center;border-radius:30px;border:1px solid var(--line);box-shadow:20px 24px 0 rgba(98,215,197,.08)}
    .cta{display:inline-block;margin-top:18px;padding:11px 18px;background:var(--accent);color:#06221f;text-decoration:none;border-radius:999px;font-weight:800}.cta.secondary{margin-left:8px;background:transparent;color:var(--text);border:1px solid var(--line)}
    section{padding:64px 0;border-top:1px solid var(--line)}h2{font-size:clamp(1.9rem,4vw,3.2rem);margin:0 0 30px}.kicker{color:var(--accent);font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.card,.timeline-item{background:linear-gradient(145deg,rgba(18,40,65,.92),rgba(9,24,42,.92));border:1px solid var(--line);border-radius:18px}.metric{padding:22px}.metric b{display:block;font-size:clamp(1.8rem,4vw,3rem);color:var(--gold);line-height:1.1}.metric span{color:var(--muted)}
    .timeline{display:grid;gap:16px}.timeline-item{padding:26px;display:grid;grid-template-columns:210px 1fr;gap:28px}.period{color:var(--accent);font-weight:750}.timeline-item h3{font-size:1.35rem;margin:0}.role{color:var(--gold);margin:.1rem 0 .8rem}.timeline-item ul{margin:.4rem 0 0;padding-left:1.25rem;color:var(--muted)}
    .edu,.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:22px}.card h3{margin:0;color:var(--accent)}.card p{margin:.35rem 0 0;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--muted);font-size:.92rem}
    footer{padding:42px 0 60px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}.noscript{padding:16px;background:#4b1d1d;color:#fff}
    @media(max-width:820px){.navlinks{display:none}.hero{grid-template-columns:1fr;min-height:auto;padding-top:40px}.portrait{order:-1;width:150px;aspect-ratio:1;border-radius:50%;box-shadow:10px 10px 0 rgba(98,215,197,.08)}.metrics{grid-template-columns:repeat(2,1fr)}.timeline-item{grid-template-columns:1fr;gap:5px}.edu,.skill-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.wrap{width:min(var(--max),calc(100% - 28px))}.hero h1{font-size:2.9rem}.metrics,.edu,.skill-grid{grid-template-columns:1fr}.cta.secondary{display:block;width:max-content;margin-left:0}.timeline-item{padding:20px}footer{display:block}}
  </style>
</head>
<body>
  <noscript><div class="noscript">請啟用 JavaScript 以顯示履歷內容。</div></noscript>
  <div class="wrap">
    <nav><div class="brand">PATRICK LIOU</div><div class="navlinks"><a href="#experience">經歷</a><a href="#education">學歷</a><a href="#skills">技能</a><a href="https://github.com/chemicalking">GitHub ↗</a></div></nav>
    <main id="app"></main>
    <footer><span>© 2026 劉晉亨 Patrick Liou</span><span>Process × Data × AI</span></footer>
  </div>
  <script src="resume-data.js"></script>
  <script>
    const d=window.RESUME_DATA;
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const tags=a=>`<div class="tags">${a.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`;
    document.querySelector("#app").innerHTML=`
      <header class="hero"><div><div class="eyebrow">Process Leadership × Data Science × AI</div><h1>${esc(d.nameZh)}<span>${esc(d.nameEn)}｜${esc(d.title)}</span></h1><p class="lead">${esc(d.summary)}</p>${tags(d.strengths)}<a class="cta" href="#experience">查看專業經歷</a><a class="cta secondary" href="https://github.com/chemicalking">GitHub 專案</a></div><img class="portrait" src="PHOTO.jpg" alt="${esc(d.nameZh)}個人照片"></header>
      <section><div class="kicker">Selected impact</div><h2>可量化成果</h2><div class="metrics">${d.highlights.map(x=>`<article class="metric"><b>${esc(x.value)}</b><span>${esc(x.label)}</span></article>`).join("")}</div></section>
      <section id="experience"><div class="kicker">Experience</div><h2>專業經歷</h2><div class="timeline">${d.experience.map(x=>`<article class="timeline-item"><div class="period">${esc(x.period)}</div><div><h3>${esc(x.company)}</h3><div class="role">${esc(x.role)}</div><ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div></article>`).join("")}</div></section>
      <section id="education"><div class="kicker">Education</div><h2>教育背景</h2><div class="edu">${d.education.map(x=>`<article class="card"><h3>${esc(x.school)}</h3><p>${esc(x.degree)}</p><p>${esc(x.period)}</p></article>`).join("")}</div></section>
      <section id="skills"><div class="kicker">Capabilities</div><h2>技能專長</h2><div class="skill-grid">${Object.entries(d.skills).map(([k,v])=>`<article class="card"><h3>${esc(k)}</h3>${tags(v)}</article>`).join("")}</div></section>`;
  </script>
</body>
</html>
